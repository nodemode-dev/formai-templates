name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The index matches the files, and the files are fit to publish
        run: |
          set -o pipefail
          python3 -I scripts/check.py | tee check-report.txt
      - name: Report
        if: always()
        run: |
          {
            echo "## formai-templates check"
            echo
            echo '```'
            cat check-report.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
